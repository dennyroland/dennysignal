name: SCTR Radar Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan Top 200 for MACD and volume radar signals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch and validate SCTR Top 500
        run: node scripts/fetch-sctr-top200.mjs artifacts/sctr-radar 500

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-radar.txt

      - name: Install radar dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-radar.txt

      - name: Scan yfinance market data
        run: >-
          python scripts/scan_sctr_radar.py
          --sctr-json artifacts/sctr-radar/sctr-top-500.json
          --output-dir artifacts/sctr-radar

      - name: Upload radar result
        uses: actions/upload-artifact@v4
        with:
          name: sctr-radar-scan
          path: artifacts/sctr-radar/
          if-no-files-found: error
          retention-days: 14
